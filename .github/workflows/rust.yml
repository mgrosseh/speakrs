name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with: 
        host: linux
        target: desktop
        arch: linux_gcc_64
    - uses: actions/checkout@v4
    - name: install pipewire
      run: |
        sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream
        sudo apt-get update
        sudo apt-get install pipewire pipewire-audio-client-libraries libpipewire-0.3-{0,dev,modules}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
