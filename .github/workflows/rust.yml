name: Rust

on:
  push:
    branches: [ "gtk" ]
  pull_request:
    branches: [ "gtk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  speakrs-bin:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install pipewireAndGtk
      run: |
        sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream
        sudo apt-get update
        sudo apt-get install pipewire pipewire-audio-client-libraries libpipewire-0.3-{0,dev,modules} alsa-base libasound2-dev libjack-jackd2-dev libpulse-dev libdbus-1-dev
        # gtk dependencies
        sudo apt-get install libgtk-4-dev=4.21.1 libadwaita-1-dev meson desktop-file-utils gcc gtk-update-icon-cache
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
